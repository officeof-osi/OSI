<style>
/* ===== OSI stylesheet (dark institutional theme) ===== */
:root{--bg-page:#101319;--bg-panel:#1c2027;--bg-side:#1a1e26;--bg-header:#0b1a36;--bg-title:#1b3a73;--bg-deep:#05090f;--border:#3a4252;--text:#d6d2c4;--muted:#9a9a96;--link:#8fb0ee;--heading:#c9d3ea;--gold:#8a7a3a;--error:#e07a7a;--serif:Georgia,"Times New Roman",serif;--sans:Arial,Helvetica,sans-serif;--mono:"Courier New",monospace;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-page);color:var(--text);font:12px/1.5 var(--sans)}
a{color:var(--link)}
h1,h2,h3{font-family:var(--serif);font-weight:normal;color:var(--heading)}
.wrap{max-width:1000px;margin:0 auto;padding:0 14px}
.date,.crumb{color:var(--muted);font-size:11px}
.crumb{margin-bottom:6px}
/* Header */
.banner{background:var(--bg-deep);color:#fff;font-size:10px;padding:3px 0;border-bottom:1px solid #000}
.site-header{background:var(--bg-header);border-bottom:4px solid var(--gold);padding:8px 0}
.site-header .wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.emblem{width:96px;height:96px;flex:none;object-fit:contain;mix-blend-mode:lighten}
.login .emblem{width:130px;height:130px}
.org h1{margin:0;color:#fff;font:normal 26px Times,"Times New Roman",serif;letter-spacing:2px}
.org .motto{color:#d9cf9e;font-size:10px;letter-spacing:3px}
.tools{margin-left:auto;text-align:right;color:#fff;font-size:11px}
.tools a{color:#fff}
.tools input{border:1px solid #5a6475;background:var(--bg-page);color:var(--text);padding:3px;font:12px var(--sans)}
.tools button,.btn{background:#2a3446;color:#e6e1d3;border:1px solid #5a6475;padding:3px 10px;font:11px var(--sans);cursor:pointer}
/* Navigation */
.main-nav{background:var(--bg-panel);border-bottom:1px solid var(--border)}
.main-nav ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap}
.main-nav li{position:relative}
.main-nav li>a{display:block;padding:6px 14px;color:var(--text);font-weight:bold;text-decoration:none;border-right:1px solid var(--border)}
.main-nav li:hover>a{background:var(--bg-title);color:#fff}
.dropdown{display:none;position:absolute;left:0;top:100%;min-width:200px;background:var(--bg-panel);border:1px solid var(--border);z-index:20}
.main-nav li:hover .dropdown,.main-nav li:focus-within .dropdown{display:block}
.dropdown a{display:block;padding:6px 12px;color:var(--link);text-decoration:none;border-bottom:1px dotted var(--border)}
.dropdown a:hover{background:#262c36}
#menu-toggle{display:none;width:100%;padding:10px;background:var(--bg-title);color:#fff;border:0;font:14px var(--sans);text-align:left}
/* Layout */
.page-grid{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:165px 1fr;background:#161a21;border-left:1px solid #2a303b;border-right:1px solid #2a303b}
.sidebar{order:-1;background:var(--bg-side);border-right:1px solid #2a303b;padding-bottom:20px}
.sidebar h4{margin:0;background:var(--bg-title);color:#fff;font:bold 11px var(--sans);text-transform:uppercase;padding:4px 8px}
.sidebar a{display:block;padding:4px 8px 4px 14px;font-size:11px;text-decoration:none;border-bottom:1px dotted #2a303b}
.sidebar a:hover{text-decoration:underline}
.sidebar p{margin:0;padding:6px 8px;font-size:10px;color:var(--muted)}
.content{min-width:0}
.content .wrap{max-width:none;padding:0 10px}
main{padding:10px 0 20px}
.columns{display:grid;grid-template-columns:1fr 190px;gap:12px}
/* Hero */
.hero{position:relative;height:200px;margin:10px 10px 0;border:1px solid var(--border);overflow:hidden;background:#0e1a2c}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero .overlay{position:absolute;inset:0;background:rgba(4,8,16,.6)}
.hero .text{position:absolute;left:14px;right:14px;bottom:12px;color:#fff}
.hero h2{margin:0 0 6px;max-width:520px;color:#fff;font:bold 20px var(--serif);text-shadow:1px 1px 2px #000}
.hero p{margin:0 0 4px;max-width:440px;font-size:11px;text-shadow:1px 1px 2px #000}
.hero a{color:#fff;font-weight:bold}
.caption{display:block;margin:0 10px;padding:2px 6px;background:var(--bg-side);color:var(--muted);font-size:10px;border:1px solid var(--border);border-top:0}
/* Content */
.box{background:var(--bg-panel);border:1px solid var(--border);padding:0 0 8px;margin-bottom:12px}
.box>*{margin-left:10px;margin-right:10px}
.box>h2,.box>h3{margin:0 0 8px;padding:4px 10px;background:var(--bg-title);color:#fff;font:bold 12px var(--sans);text-transform:uppercase;letter-spacing:.5px}
.box>h3.sub{background:none;color:var(--heading);text-transform:none;font:bold 13px var(--serif);border-bottom:1px solid var(--border);padding-left:0;margin:12px 10px 6px}
table{width:100%;border-collapse:collapse}
th,td{padding:5px 8px;text-align:left;border:1px solid var(--border)}
th{background:#262c36}
/* Forms and login */
input.field,textarea.field{display:block;width:100%;margin:3px 0 10px;padding:5px;background:var(--bg-page);color:var(--text);border:1px solid #5a6475;font:13px var(--sans)}
.login{max-width:380px;margin:30px auto;text-align:center}
.login form{text-align:left}
.error{min-height:16px;color:var(--error);font-size:12px}
.notice{margin-top:14px;padding:8px;border:1px solid #5a6475;color:#b8b4a6;font-size:11px;text-align:center}
/* Portal */
.portal{background:#0b0e13;font-family:var(--mono);min-height:60vh}
.portal-bar{display:flex;flex-wrap:wrap;justify-content:space-between;padding:8px 14px;background:var(--bg-deep);border-bottom:1px solid var(--border);color:#e6e1d3}
.portal-grid{display:grid;grid-template-columns:200px 1fr;gap:16px;max-width:1000px;margin:16px auto;padding:0 14px}
.portal-menu a{display:block;margin-bottom:-1px;padding:7px 10px;background:var(--bg-panel);border:1px solid var(--border);text-decoration:none}
.portal .box h2{font-family:var(--mono)}
.restricted{margin-top:10px;padding:10px;border:1px dashed var(--error);color:var(--error)}
/* Footer */
.site-footer{background:var(--bg-deep);color:var(--muted);border-top:4px solid var(--gold);padding:16px 0;text-align:center;line-height:1.9}
.site-footer a{color:#fff}
.abstract{border-left:3px solid var(--gold);padding:4px 10px;margin:8px 10px;background:var(--bg-side)}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.results li{margin-bottom:8px}
.dl a{font-weight:bold}
@media print{.banner,.main-nav,.sidebar,.site-footer,.tools,#menu-toggle{display:none}body{background:#fff;color:#000}}
.st-active{color:#7fd48a;font-weight:bold}.st-deployed{color:#e0b45a;font-weight:bold}.st-offline{color:#8a8a86}
#rs{background:var(--bg-page)}
/* Mobile */
@media(max-width:720px){
#menu-toggle{display:block}
.main-nav ul{display:none;flex-direction:column}
.main-nav ul.open{display:flex}
.dropdown{position:static;display:block;border:0}
.dropdown a{padding-left:28px}
.page-grid,.columns,.portal-grid{grid-template-columns:1fr}
.sidebar{order:2;border-right:0}
.tools{margin-left:0;text-align:left}
.hero{height:220px}
table{display:block;overflow-x:auto}}
</style>
</head>

const PAPERS = [
  { id: "OSI-RP-2003-11", title: "Remote Terrain Survey Methods in Forested Regions", author: "Dr. Elena V. Marsh, Directorate of Research", date: "November 2003", topic: "Geographical Research",
    abstract: "This paper reviews methods used by the Office to survey remote and densely forested terrain, comparing aerial photography, ground survey and open-source mapping.",
    body: ["Forested regions present persistent difficulties for survey work. Canopy cover obscures ground features, and access routes are often seasonal or undocumented. The Office has therefore relied on a combination of methods, each with known limits.",
           "Aerial photography remains the most efficient way to cover large areas, but its value depends on season and angle. Photographs taken in early spring, when leaf cover is thin, reveal far more structure than summer imagery. Ground survey provides certainty at the cost of time and personnel.",
           "We recommend a staged approach: broad aerial coverage, targeted ground verification and the cross-checking of findings against historical maps held by the Office of Records and Archives. Where discrepancies arise, they should be recorded rather than resolved by assumption."],
    refs: ["OSI Field Survey Manual, 3rd ed., 2001.", "Northern Geographic Survey Institute, Annual Review, 2002."] },
  { id: "OSI-RP-2004-03", title: "Archival Methods for Mid-Century Government Records", author: "Margaret A. Lindqvist, Office of Records and Archives", date: "March 2004", topic: "Historical Records",
    abstract: "A study of preservation, indexing and declassification practice for records created between 1947 and 1975.",
    body: ["Records created in the early decades of the Office were produced under varying standards. Many lack consistent reference numbers, and some were transferred between departments without a transfer note.",
           "This paper proposes a uniform indexing scheme and a set of preservation priorities based on the physical condition of each series. It also describes the review procedure by which records are assessed for release.",
           "Our findings suggest that roughly one fifth of the surveyed holdings can be released with minimal redaction. The remainder require further review, which the Office intends to complete over the next five years."],
    refs: ["Records Retention Schedule, OSI-RRS-2002.", "Continental Archives Consortium, Preservation Guidelines, 2003."] },
  { id: "OSI-RP-2004-09", title: "Indicators of Regional Strategic Stability", author: "Dr. Thomas R. Aldous, Directorate of Analysis", date: "September 2004", topic: "Strategic Studies",
    abstract: "This paper proposes a set of twelve indicators for assessing regional stability and tests them against historical cases.",
    body: ["Assessments of stability often rely on a single dramatic event. We argue that slow-moving indicators, such as trade patterns, administrative continuity and demographic change, are more reliable guides.",
           "Twelve indicators are defined and scored on a five-point scale. Testing against twenty historical cases showed that composite scores gave earlier warning than event-based methods in fourteen of them.",
           "The method is not predictive. It is intended to structure judgement, not replace it, and every score should be accompanied by a statement of confidence."],
    refs: ["Annual Strategic Intelligence Assessment 2003, OSI-PUB-2004-01.", "Allied Joint Research Council, Working Paper 14, 2004."] },
  { id: "OSI-RP-2005-01", title: "Open-Source Collection and the Reliability of Sources", author: "Dr. Harold J. Whitcombe, Office of the Director", date: "January 2005", topic: "Intelligence Assessment",
    abstract: "A discussion of how open sources should be graded for reliability, with recommendations for analysts.",
    body: ["The volume of open material available to analysts has grown rapidly. Volume is not reliability, and the Office requires a disciplined way of weighing what it reads.",
           "We propose a two-part grading: one for the source and one for the information itself. Independent corroboration raises confidence, while repetition across dependent sources does not.",

let ROSTER = null;
const getRoster = () => ROSTER || (ROSTER = JSON.parse(atob(ROSTER_B64)));

function portalShell(inner) {
  return `<div class="portal"><div class="portal-bar"><span><img src="${CONFIG.favicon}" alt="" style="height:18px;vertical-align:middle;mix-blend-mode:lighten"> OSI INTERNAL SYSTEM // SESSION AUTHENTICATED</span><a href="#home" onclick="logout()">Log out</a></div>
  <div class="portal-grid"><div class="portal-menu"><a href="#portal">0. Dashboard</a>${PORTAL_SECTIONS.map((s, i) => `<a href="#portal-${i + 1}">${i + 1}. ${s}</a>`).join("")}</div><div class="box">${inner}</div></div></div>`;
}
function portalPage(n) {
  if (!n) return portalShell(`<h2>Internal Portal</h2><p>Welcome. Select a section.</p>${table(["Section", "Status"], PORTAL_SECTIONS.map((s, i) => [`<a href="#portal-${i + 1}">${s}</a>`, PORTAL_STATUS[i]]))}<p class="date">Notice: sessions expire when the browser is closed.</p>`);
  const name = PORTAL_SECTIONS[n - 1];
  if (!name) return portalPage(0);
  if (n === 1) return portalShell(`<h2>${name}</h2><p>Routine administrative records. Higher-level records are held in separate systems.</p>${table(["Ref.", "Date", "Subject", "Summary"], [
    ["IR-2005-0297", "11 Apr 2005", "Archive transfer log, Annex B", "Transfer of series OSI-GR-04 to the Records Modernisation Programme."],
    ["IR-2005-0351", "30 Jun 2005", "Staff training calendar", "Training schedule for the third and fourth quarters."],
    ["IR-2005-0388", "8 Aug 2005", "Retention schedule revision", "Revised retention periods for administrative files."],
    ["IR-2005-0412", "19 Sep 2005", "Facilities notice", "Changes to access arrangements for the east wing."]])}`);
  if (n === 6) return portalShell(`<h2>${name}</h2><p>Registered player accounts under routine monitoring. Search by username or filter by status.</p>
    <p><input class="field" id="rq" placeholder="Search username…" oninput="filterRoster()" autocomplete="off" style="display:inline-block;width:60%"> <select class="field" id="rs" onchange="filterRoster()" style="display:inline-block;width:30%"><option value="">All statuses</option><option>Active</option><option>Deployed</option><option>Offline</option></select></p>
    <p class="date" id="rcount"></p>
    <table><thead><tr><th>#</th><th>Username</th><th>Status</th></tr></thead><tbody id="rbody"></tbody></table>`);
  if (n === 3) return portalShell(`<h2>${name}</h2><p class="restricted">SECTION UNDER MAINTENANCE. The index for this archive is being rebuilt. Ref. OSI-MNT-0305. Estimated return to service: not available.</p>`);
  return portalShell(`<h2>${name}</h2><div class="restricted">ACCESS DENIED. Your account does not hold the clearance required for this section.<br>Required: ${CLEARANCE[n]}<br>Reference: OSI-ACL-${String(n).padStart(2, "0")}-${2005}</div><p>To request access, contact the Office of Records and Archives.</p>`);
}

function filterRoster() {
  const q = document.getElementById("rq").value.trim().toLowerCase(), st = document.getElementById("rs").value;
  const all = getRoster(), rows = all.filter(r => (!q || r.n.toLowerCase().includes(q)) && (!st || r.s === st));
  document.getElementById("rbody").innerHTML = rows.length ? rows.map(r => `<tr><td>${all.indexOf(r) + 1}</td><td>${esc(r.n)}</td><td class="st-${r.s.toLowerCase()}">${r.s.toUpperCase()}</td></tr>`).join("") : `<tr><td colspan="3">No matching usernames.</td></tr>`;
  document.getElementById("rcount").textContent = `Showing ${rows.length} of ${all.length} accounts`;
}

/* ---------- 6. AUTH (plain-text credentials from CONFIG) ---------- */
let memorySession = false;
const isAuthenticated = () => { try { return sessionStorage.getItem(CONFIG.sessionKey) === "1"; } catch (e) { return memorySession; } };
function logout() { try { sessionStorage.removeItem(CONFIG.sessionKey); } catch (e) {} memorySession = false; }
function handleLogin(event) {
  event.preventDefault();
  const user = document.getElementById("u").value.trim().toLowerCase();
  const pass = document.getElementById("p").value;
  if (user === CONFIG.adminUser.toLowerCase() && pass === CONFIG.adminPass) {
    try { sessionStorage.setItem(CONFIG.sessionKey, "1"); } catch (e) {}
    memorySession = true;
    location.hash = "portal";
  } else document.getElementById("error").textContent = "Authentication failed. This attempt has been logged.";
  return false;
}

/* ---------- 7. DOWNLOADS, FORMS, SEARCH ---------- */
function download(kind, i) {
  const d = kind === "paper" ? PAPERS[i] : PUBLICATIONS[i];
  const body = kind === "paper" ? d.body.concat(["", "REFERENCES", ...d.refs]) : d.body;
  const text = [`OFFICE OF STRATEGIC INTELLIGENCE`, d.id, d.title, d.author || "", d.date, "", d.abstract || d.summary, "", ...body, "", "UNCLASSIFIED. Work of fiction."].join("\r\n\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "text/plain" }));
  a.download = d.id + ".txt";
  document.body.appendChild(a); a.click(); a.remove();
  return false;
}

function handleForm(event, kind) {
  event.preventDefault();
  event.target.innerHTML = `<p><b>Thank you.</b> Your ${kind.toLowerCase()} has been logged (Ref. OSI-ENQ-${Date.now().toString().slice(-6)}). You will receive an acknowledgement within ten working days.</p>`;
  return false;
}

let searchQuery = "";
function handleSearch(event) {
  event.preventDefault();
  searchQuery = document.getElementById("q").value.trim();
  if (location.hash === "#search") route(); else location.hash = "search";
  return false;
}
function searchHtml(query) {
  const q = query.toLowerCase();
  const hits = Object.keys(PAGES).map(k => {
    const pg = PAGES[k](), text = pg.html.replace(/<[^>]*>/g, " ").replace(/\s+/g, " ");
    const at = (pg.title + " " + text).toLowerCase().indexOf(q);
    if (!q || at < 0) return null;
    const pos = text.toLowerCase().indexOf(q);
    const snip = pos < 0 ? text.slice(0, 120) : text.slice(Math.max(0, pos - 50), pos + 90);
    return `<li><a href="#${k}">${pg.title}</a><br><span class="date">…${esc(snip)}…</span></li>`;
  }).filter(Boolean);
  return `<p>${hits.length} result(s) for "<b>${esc(query)}</b>":</p>${hits.length ? `<ul class="results">${hits.join("")}</ul>` : "<p>No documents found. Try a different term.</p>"}`;
}

/* ---------- 8. ROUTER ---------- */
function route() {
  const hash = location.hash.slice(1) || "home";
  let html;
  if (hash.startsWith("portal")) {
    html = isAuthenticated() ? portalPage(Number(hash.slice(7)) || 0) : RAW["admin-access"]();
  } else if (hash === "search") html = contentPage("Search Results", searchHtml(searchQuery));
  else if (RAW[hash]) html = RAW[hash]();
  else if (PAGES[hash]) { const pg = PAGES[hash](); html = contentPage(pg.title, pg.html); }
  else html = contentPage("Page Not Found", `<p>The page you requested could not be found. Try the <a href="#sitemap">site map</a> or <a href="#home">return home</a>.</p>`);
  document.getElementById("app").innerHTML = html;
  if (hash === "portal-6" && isAuthenticated()) filterRoster();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
